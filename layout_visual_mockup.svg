<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      .title { font: bold 18px Arial; fill: #1f2937; }
      .label { font: 14px Arial; fill: #111827; }
      .small { font: 12px Arial; fill: #374151; }
      .box { fill: #f9fafb; stroke: #6b7280; stroke-width: 1.5; }
      .header { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; }
      .panel { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; }
      .section { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1; }
      .accent { fill: #e5e7eb; stroke: #6b7280; stroke-width: 1; }
      .result { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.2; }
      .log { fill: #f8fafc; stroke: #64748b; stroke-width: 1.2; }
    </style>
  </defs>

  <!-- Root window -->
  <rect x="20" y="20" width="1160" height="660" rx="8" class="box"/>

  <!-- Header row -->
  <rect x="40" y="40" width="1120" height="110" rx="6" class="header"/>

  <rect x="55" y="55" width="200" height="80" rx="5" class="panel"/>
  <text x="155" y="88" text-anchor="middle" class="title">User Details</text>
  <text x="155" y="108" text-anchor="middle" class="small">Operator Name</text>
  <text x="155" y="122" text-anchor="middle" class="small">QA Name</text>

  <rect x="275" y="55" width="300" height="80" rx="5" class="panel"/>
  <text x="425" y="88" text-anchor="middle" class="title">TCU - 4G</text>
  <text x="425" y="108" text-anchor="middle" class="small">ADVANCED TELEMATICS CONTROL UNIT</text>

  <rect x="595" y="55" width="220" height="80" rx="5" class="panel"/>
  <text x="705" y="88" text-anchor="middle" class="title">Date &amp; Time</text>
  <text x="705" y="108" text-anchor="middle" class="small">DATE / TIME / STOPWATCH</text>

  <rect x="835" y="55" width="300" height="80" rx="5" class="panel"/>
  <text x="985" y="88" text-anchor="middle" class="title">Logo</text>
  <text x="985" y="108" text-anchor="middle" class="small">Accolade Electronics Pvt Ltd</text>

  <!-- Main row -->
  <rect x="40" y="170" width="1120" height="470" rx="6" class="section"/>

  <!-- Column 0: controls -->
  <rect x="60" y="190" width="330" height="430" rx="6" class="panel"/>
  <text x="225" y="220" text-anchor="middle" class="title">Controls / Settings</text>

  <rect x="80" y="240" width="280" height="50" rx="5" class="accent"/>
  <text x="220" y="272" text-anchor="middle" class="label">BSNL Mode  |  Airtel Mode</text>

  <rect x="80" y="305" width="280" height="40" rx="5" class="accent"/>
  <text x="220" y="330" text-anchor="middle" class="label">Scan QR</text>

  <rect x="80" y="360" width="280" height="60" rx="5" class="accent"/>
  <text x="220" y="389" text-anchor="middle" class="label">Select COM Port</text>
  <text x="220" y="406" text-anchor="middle" class="small">Baudrate</text>

  <rect x="80" y="440" width="120" height="38" rx="5" class="accent"/>
  <text x="140" y="465" text-anchor="middle" class="label">Update List</text>

  <rect x="220" y="440" width="120" height="38" rx="5" class="accent"/>
  <text x="280" y="465" text-anchor="middle" class="label">CONNECT</text>

  <rect x="150" y="500" width="140" height="52" rx="5" class="accent"/>
  <text x="220" y="533" text-anchor="middle" class="title">START</text>

  <!-- Column 1: result + count + digital status -->
  <rect x="410" y="190" width="330" height="430" rx="6" class="panel"/>
  <text x="575" y="220" text-anchor="middle" class="title">Result / Count / Status</text>

  <rect x="430" y="245" width="290" height="110" rx="6" class="result"/>
  <text x="575" y="285" text-anchor="middle" class="small">Result</text>
  <text x="575" y="325" text-anchor="middle" class="title">PASS / FAIL</text>
  <text x="575" y="340" text-anchor="middle" class="small">Reason / details below</text>

  <rect x="430" y="370" width="290" height="80" rx="6" class="accent"/>
  <text x="575" y="400" text-anchor="middle" class="label">Total Count</text>
  <text x="575" y="425" text-anchor="middle" class="small">Pass Count: 0   Fail Count: 0</text>

  <rect x="430" y="465" width="290" height="120" rx="6" class="accent"/>
  <text x="575" y="495" text-anchor="middle" class="label">Digital Status</text>
  <circle cx="520" cy="535" r="22" fill="#fca5a5" stroke="#000"/>
  <circle cx="630" cy="535" r="22" fill="#fca5a5" stroke="#000"/>
  <text x="520" y="540" text-anchor="middle" class="small">DO1</text>
  <text x="630" y="540" text-anchor="middle" class="small">DO2</text>

  <!-- Column 2: log + progress -->
  <rect x="760" y="190" width="360" height="430" rx="6" class="panel"/>
  <text x="940" y="220" text-anchor="middle" class="title">Log / Progress</text>

  <rect x="780" y="245" width="320" height="210" rx="6" class="log"/>
  <text x="940" y="270" text-anchor="middle" class="small">Serial Output / Log Window</text>
  <line x1="800" y1="285" x2="1080" y2="285" stroke="#cbd5e1"/>
  <text x="800" y="315" class="small">[INFO] Device connected</text>
  <text x="800" y="335" class="small">[DATA] Sending command...</text>
  <text x="800" y="355" class="small">[RESULT] PASS</text>
  <text x="800" y="375" class="small">[STATUS] Ready for next test</text>

  <rect x="780" y="470" width="320" height="110" rx="6" class="accent"/>
  <text x="940" y="500" text-anchor="middle" class="label">Progress</text>
  <rect x="810" y="515" width="260" height="18" rx="9" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="810" y="515" width="160" height="18" rx="9" fill="#60a5fa"/>
  <text x="940" y="555" text-anchor="middle" class="small">Status: Running / Completed</text>
</svg>
